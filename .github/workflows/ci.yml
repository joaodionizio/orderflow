name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          skip-lts-prepass: true

      - name: Restore and audit NuGet packages
        run: >-
          dotnet restore OrderFlow.sln
          -p:NuGetAudit=true -p:NuGetAuditMode=all
          -warnAsError:NU1900,NU1901,NU1902,NU1903,NU1904,NU1905

      - name: Report direct and transitive vulnerabilities
        run: dotnet package list --project OrderFlow.sln --no-restore --include-transitive --vulnerable

      - name: Build
        run: dotnet build OrderFlow.sln --configuration Release --no-restore

      - name: Test with SQL Server
        shell: bash
        run: |
          export MSSQL_SA_PASSWORD="Aa1!$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$MSSQL_SA_PASSWORD"
          docker run --detach --rm --name orderflow-ci-sql --publish 127.0.0.1:1433:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null
          for attempt in {1..30}; do
            if docker exec orderflow-ci-sql bash -c 'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 2 -b -Q "SELECT 1"' >/dev/null 2>&1; then
              export ORDERFLOW_TEST_SQLSERVER="Server=127.0.0.1,1433;User ID=sa;Password=$MSSQL_SA_PASSWORD;TrustServerCertificate=True"
              dotnet test OrderFlow.sln --configuration Release --no-build --logger 'console;verbosity=normal'
              exit 0
            fi
            sleep 2
          done
          echo 'SQL Server did not become ready.' >&2
          exit 1
